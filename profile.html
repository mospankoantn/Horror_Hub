<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій Профіль - Horror Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Special+Elite&family=Raleway:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">

  <!-- Підключаємо auth.js для верхнього меню -->
  <script src="js/auth.js"></script>

</head>
<body>

  <header>
    <h1>Horror Hub</h1>
  </header>

  <nav>
    <a href="index.html">Головна</a>
    <a href="horror_games.html">Ігри Жахів</a>
    <a href="horror_movies.html">Фільми Жахів</a>
    <a href="reviews.html">Огляди</a>
    <a href="articles.html">Статті</a>
    <a href="game.html">Ігрова Кімната</a>
    <a href="contact.html">Контакти</a>
    <a href="https://t.me/moyi_statti" target="_blank" class="tg-link" rel="noopener noreferrer">Telegram</a>
    <div id="user-menu"></div>
  </nav>

  <main class="container">
    <div class="contact-wrapper">
      <div class="profile-header" id="profile-info">
        <!-- Аватар та ім'я підвантажаться через JS -->
        <p class="muted-text">Завантаження душі...</p>
      </div>

      <form id="profileForm" class="contact-form" hidden>
        
        <div class="form-group">
          <label>URL нової аватарки:</label>
          <input type="text" name="avatar" id="avatarInput" placeholder="https://example.com/my-scary-avatar.jpg">
          <p class="help-text">Вставте пряме посилання на картинку з інтернету (jpg, png, gif).</p>
        </div>

        <div class="form-group">
          <label>Новий пароль:</label>
          <input type="password" name="new_password" placeholder="Введіть новий пароль">
          <p class="help-text">Залиште пустим, якщо не хочете змінювати пароль.</p>
        </div>

        <button type="submit" id="saveBtn">Зберегти зміни</button>
        <div id="profileMessage" class="profile-message"></div>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <a href="index.html" class="footer-logo">Horror Hub</a>
      <p class="footer-copy">&copy; 2026 Horror Hub. Всі права захищено.</p>
    </div>
  </footer>

  <script src="js/profile.js"></script>
</body>
</html>
